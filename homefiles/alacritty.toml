[font]
size = 20.0

[font.normal]
family = "Fira Code"
style = "Regular"

[font.bold]
family = "Fira Code"
style = "Bold"

[font.italic]
family = "Fira Code"
style = "Italic"

[window]
decorations = "None"

[colors.primary]
background = '#000000'
foreground = '#bbbbbb'

[colors.normal]
black   = '#000000'
red     = '#cc0000'
green   = '#00aa00'
yellow  = '#cccc00'
blue    = '#5555ff'
magenta = '#aa00aa'
cyan    = '#00aaaa'
white   = '#aaaaaa'

[colors.bright]
black   = '#555555'
red     = '#ff5555'
green   = '#55ff55'
yellow  = '#ffff66'
blue    = '#7777ff'
magenta = '#ff55ff'
cyan    = '#55ffff'
white   = '#ffffff'

[[keyboard.bindings]]
key = "Z"
mods = "Control|Shift"
chars = "\u001b[17;5u"

[window.dimensions]
columns = 150
lines = 32
