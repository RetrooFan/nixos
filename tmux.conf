#set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
#run '~/.tmux/plugins/tpm/tpm'

setw -g mode-keys vi
set -g status-position top
set -g status-right-length 50
set -g default-terminal "tmux-256color"
set -g detach-on-destroy off
set -g prefix2 M-b

set-option -g history-limit 10000
set-option -g @empty_space ' '
set-option -g @status_bg '#[bg=green]'
set-option -g status-right '#{?#{==:#{window-size},manual},#{?pane_in_mode,#[bg=yellow],#[bg=red]},}#[bold]#{window_width}x#{window_height}#[fg=default,bg=default,nobold]#{@empty_space}#{@status_bg}#H %H:%M %d-%b-%y'

#bind-key    -T root         C-t                    run-shell "echo 'Działa!'"
bind-key    -T root         C-PPage                previous-window
bind-key    -T root         C-NPage                next-window
bind-key    -T root         M-z                    previous-window
bind-key    -T root         M-x                    next-window
bind-key    -T root         C-t                    new-window -c "#{pane_current_path}"
bind-key    -T root         C-[DC1]                send-keys C-y
bind-key    -T root         C-\\                   split-window -h -c "#{pane_current_path}"
bind-key    -T root         M-C-\\                 split-window -c "#{pane_current_path}"
bind-key    -T root         C-S-PPage              swap-window -t -1\; select-window -t -1
bind-key    -T root         C-S-NPage              swap-window -t +1\; select-window -t +1
bind-key    -T root         M-t                    new-session
bind-key    -T root         M-PPage                switch-client -p
bind-key    -T root         M-NPage                switch-client -n
bind-key    -T root         M-z                    switch-client -p
bind-key    -T root         M-x                    switch-client -n
bind-key    -T root         IC                     copy-mode
bind-key    -T prefix       M-b                    send-keys M-b
bind-key    -T prefix       C-b                    send-keys C-b
bind-key    -T prefix       C-t                    send-keys C-t
bind-key    -T prefix       C-\\                   send-keys C-\\
bind-key    -T prefix       C-z                    send-keys M-Z
bind-key    -T prefix       BSpace                 command-prompt -k -p "Wcisnij:" "display-message 'Klawisz: %1'"
bind-key    -T prefix       IC                     if-shell "tmux show-window-options -v window-size | grep -q manual" \
                                                   "set-window-option window-size latest" \
                                                   "run-shell 'tmux resize-window -x 160 -y $(($(tmux display-message -p \"#{client_height}\")-1))'"
bind-key    -T copy-mode-vi IC                     send-keys -X cancel
bind-key    -T copy-mode-vi C-Left                 send-keys -X previous-word
bind-key    -T copy-mode-vi C-Right                send-keys -X next-word
