apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    api:
      dashboard: true
    ingressRoute:
      dashboard:
        enabled: true
    ports:
      traefik:
        expose:
          default: true
        exposedPort: 8080
        port: 8080
    certificatesResolvers:
      letsencrypt:
        acme:
          email: test@email.com
          storage: /data/acme.json
          httpChallenge:
            entryPoint: web
    ports:
      websecure:
        tls:
          certResolver: letsencrypt
